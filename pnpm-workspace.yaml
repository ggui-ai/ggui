packages:
  # All public @ggui-ai/* packages (the publishable set; the leaf-first
  # publish order lives in .github/workflows/release.yml).
  # benchmark + benchmark-viewer are workspace-private under misc/.
  - "packages/agent-runtime"
  - "packages/agent-server"
  - "packages/artifact-manifest"
  - "packages/blueprint-probe"
  - "packages/live-channel"
  - "packages/console"
  - "packages/design"
  - "packages/dev-stack"
  - "packages/embedding-local"
  - "packages/gadget-signing"
  - "packages/gadgets"
  - "packages/ggui-cli"
  - "packages/mcp-apps-react"
  - "packages/mcp-apps-react-native"
  - "packages/iframe-runtime"
  - "packages/mcp-server"
  - "packages/mcp-server-core"
  - "packages/mcp-server-handlers"
  - "packages/negotiator"
  - "packages/preview-a2ui"
  - "packages/project-config"
  - "packages/protocol"
  - "packages/protocol-conformance"
  - "packages/protocol-reference-server"
  - "packages/registry-core"
  - "packages/registry-server"
  - "packages/sandbox"
  - "packages/shared"
  - "packages/ui-gen"
  - "packages/ui-registry"
  - "packages/ui-visual-tester"
  - "packages/wire"
  # OSS e2e suites — journeys (Playwright), wire-scenario contract suite,
  # and the Tier-2 MCP Apps host simulator (vitest, no browser).
  - "e2e/journeys"
  - "e2e/wire-scenarios"
  - "e2e/mcp-host-simulator"
  # guuey-interop matrix (ggui#429) — keyless proof of the render
  # channel against @guuey/* at exact published pins.
  - "e2e/guuey-integration"
  # Sub-tier B container e2e — render + cache-hit + seed-pool against an
  # app COMPOSED directly from samples/* (Verdaccio cohort →
  # compose-app.mjs → pnpm dev).
  - "e2e/samples-render"
  # Shared e2e fixtures — marketplace test repos (published gadget /
  # blueprint repos exercising publish→search→install) and the
  # dependency-free mcp-turn MCP turn-driver.
  - "e2e/fixtures/*"
  # Reference samples — one agent framework / gadget / ggui / mcp-server
  # per dir. Workspace-private; not published.
  - "samples/agents/*"
  # Cell isolation (spec §2): pinned @guuey transitives must never hoist with workspace HEAD, #426.
  # (samples/apps/* is not a workspace glob here today; the apps exclusion is
  # belt-and-braces so a future glob addition can never pull the pinned dir in.)
  - "!samples/agents/with-guuey"
  - "!samples/apps/with-guuey-web"
  - "samples/gadgets/*"
  - "samples/gguis/*"
  - "samples/mcp-servers/*"
  # Workspace-private OSS tooling — benchmark + benchmark-viewer. Never
  # published.
  - "misc/*"

# ─── Settings migrated from package.json#pnpm + .npmrc (pnpm 11 move) ───
#
# pnpm 11 no longer reads `pnpm.*` from package.json or pnpm-specific
# settings from .npmrc. Everything pnpm-flavored must live here.

# Dep pin overrides. Migrated from package.json#pnpm.overrides. CVE pins
# + ecosystem-wide bumps so the OSS publish wave's transitive graph is
# unified and audit-clean.
overrides:
  # React floors are EXACT-SAME here and in the root pnpm-workspace.yaml
  # on purpose — the two workspaces install over overlapping directories
  # (hoisted), and a split between the trees makes tsc see two
  # @types/react copies → "ReactNode is not assignable to ReactNode".
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "zod@>=4": ^4.4.3
  "lodash@<4.18.0": ^4.18.1
  "picomatch@<2.3.2": ^2.3.2
  "picomatch@>=4.0.0 <4.0.4": ^4.0.4
  "postcss@<8.5.23": ^8.5.23
  "brace-expansion@>=1 <2": ^1.1.18
  "brace-expansion@>=2 <3": ^2.1.4
  "@tootallnate/once@<3.0.1": ^3.0.1
  "tar@<7.5.21": ^7.5.21
  # sigstore trio + body-parser/form-data floors (2026-08-04 wave 2):
  # pnpm-update leg hung; floors force the same in-range resolutions.
  "sigstore@<4.1.1": ^4.1.1
  "@sigstore/core@<3.2.1": ^3.2.1
  "@sigstore/verify@<3.1.1": ^3.1.1
  "body-parser@>=1 <1.20.6": ^1.20.6
  "body-parser@>=2 <2.3.0": ^2.3.0
  "form-data@>=2 <2.5.6": ^2.5.6
  "form-data@>=4 <4.0.6": ^4.0.6
  "@anthropic-ai/sdk@<0.91.1": ^0.91.1
  # DB-driver CVE floors (alerts 406-412, 2026-09-02) — lockstep with the
  # root yaml (check-lockfile-split --overrides); see root comment for
  # the peer-rewrite assessment.
  "mysql2@<3.22.0": ^3.22.0
  "mariadb@<3.4.6": ^3.4.6
  # vite floor RETIRED 2026-08-22 (was "vite@<6.4.3": ^6.4.3, advisories
  # 247/248): pnpm rewrites INTERSECTING peer ranges too, so the floor
  # clamped vitest 4's true `^6||^7||^8` vite peer to ^6.4.3 and broke
  # the vite-8 lane. The floor's job is done — every fresh resolution of
  # a ^6-range lands ≥6.4.3 (verified in both lockfiles at retirement).
  # If a transitive context ever entrenches <6.4.3 again, prefer
  # peerDependencyRules or an exact-version selector over a range floor.
  # esbuild: no workspace-wide pin (#758) — mirrors the root yaml; the two
  # prior floors (<0.25.0 → ^0.25.0; >=0.27.3 <0.28.1 → ^0.28.1) were dormant
  # (one 0.25.12 arm existed) and are retired.
  "uuid@<14.0.0": ^14.0.0
  # Exact-pinned SAME as root: the two workspaces install over
  # overlapping hoisted trees, and tsc only unifies duplicate packages
  # at identical name+version. A version split here makes the cloud pod
  # see two nominal McpServer classes (install-order dependent!).
  "@modelcontextprotocol/sdk": 1.30.0
  # Same invariant (2.x only — @google/adk's 1.52.0 chain stays put).
  "@google/genai@>=2": 2.15.0
  # Same invariant — 13.16-vs-13.17 split broke RN <WebView> JSX in CI.
  react-native-webview: 13.16.1
  # Same invariant, NATIVE flavor — dual sharp = libvips soname collision
  # under hoisting; 0.35.x also satisfies GHSA-f88m-g3jw-g9cj.
  sharp: 0.35.3
  # Same invariant — single version repo-wide. 25.6.0 also clears the
  # extract-zip symlink-traversal Dependabot alert (no patched
  # extract-zip exists; @puppeteer/browsers 3.x dropped the dependency
  # entirely). The 24.43 waitUntil-union narrowing that forced the old
  # 24.42.0 pin is re-verified against 25.x by ui-gen's typecheck.
  puppeteer-core: 25.6.0
  "@smithy/types": ^4.14.0
  "brace-expansion@>=5": ^5.0.9
  # fast-uri floor raised 3.1.4 → 3.1.6 (2026-09-03: GHSA-5jgf-p345-68v8 / f65p-4m7j-42xc / fph4-wmhf-6fwf / jqff-g426-hqxp, HIGH, published 2026-09-02; ajv@8 resolver, in the pod + backend prod closures). Same-major.
  "fast-uri@<3.1.6": ^3.1.6
  # immutable <3.8.4 (GHSA-xvcm-6775-5m9r, HIGH; surfaced by the 2026-09-03
  # rescan — Amplify codegen devDeps chain: @ardatan/relay-compiler →
  # appsync-modelgen-plugin → backend-cli; build toolchain, not shipped).
  "immutable@<3.8.4": ^3.8.4
  # fflate 0.8.0–0.8.2 (GHSA-px8p-9vwx-vf98, MEDIUM; @smithy/middleware-
  # compression ← @aws-sdk/client-cloudwatch — cloud Lambda runtime).
  # Scoped to the 0.8 line: posthog-js's fflate 0.4.9 is outside the
  # advisory and a 0.x-minor move there would be MAJOR-class.
  "fflate@>=0.8.0 <0.8.3": ^0.8.3
  "fast-xml-builder@<1.1.7": ^1.1.7
  # Kept in lockstep with the root workspace's block. These two files
  # drifted once — the root had no security overrides at all while this
  # one did — so the public repo was better patched than the monorepo
  # for the same transitive graph. Same-major targets only; cross-major
  # advisories stay out of both.
  hono: ^4.12.34
  handlebars: ^4.7.9
  shell-quote: ^1.9.0
  dompurify: ^3.4.6
  # nodemailer override removed 2026-08-04 (lockstep with root): sole
  # consumer is mcp-server's direct dep, bumped to ^9.0.1 — no patched
  # 8.x exists for GHSA-p6gq-j5cr-w38f.
  undici: ^7.28.0
  "fast-xml-parser@>=4 <5": ^4.5.5
  "fast-xml-parser@>=5": ^5.8.0
  "js-yaml@>=3 <4": ^3.15.1
  "js-yaml@>=4": ^4.3.1
  "ip-address@<10.3.1": ^10.3.1
  "@mikro-orm/knex@<6.6.14": ^6.6.14
  # qs floor raised 6.15.2 → 6.16.0 (2026-09-03: GHSA-4mjr-xmp4-gh2g / x5fp-wj9c-mxmx, MEDIUM, published 2026-09-02; express 5 / body-parser, in the pod + backend prod closures). Same-major.
  "qs@>=6.11.1 <6.16.0": ^6.16.0
  "protobufjs@<7.6.5": ^7.6.5
  # @opentelemetry/core <2.8.0 (advisory 256; root carries 282): every
  # otel package exact-pins its sibling core (resources@2.1.0 →
  # core@2.1.0), so plain update can't move it — a floor is the only
  # lever. Same-major (2.x). Sole chains run through @google/adk
  # (ui-gen devDeps + samples). Kept in lockstep with the root
  # workspace's line (2026-08-07).
  "@opentelemetry/core@<2.8.0": ^2.8.0
  # adm-zip <0.6.0 (advisory 395, root-lock only): sole consumer is
  # @google/adk@1.5.0, which declares ^0.5.17 — hence the scoped
  # override. Per-consumer judgement DONE 2026-08-07: adk's entire
  # adm-zip surface (skills/loader.js — constructor(Buffer),
  # getEntries(), entry.entryName / .isDirectory / .getData()) is
  # unchanged in 0.6.0. Caret keeps future 0.7.x out — a bare floor
  # would drag consumers across the next breaking line, which is
  # exactly the breakage this file exists to avoid.
  "adm-zip@<0.6.0": ^0.6.0
  "immutable@<3.8.3": ^3.8.3
  # Exact-pinned SAME as root (ggui#430) — force ONE dispatcher copy per
  # tree, and the same one in both trees. Moved 0.3.1 → 0.4.0 with the
  # withguuey 0.4.0 wave (#506); see the root pnpm-workspace.yaml entry
  # for why the family moves together (agent-client/threads 0.4.0 both
  # exact-pin host 0.4.0, and agent-client value-imports an export 0.3.1
  # does not have).
  "@guuey/mcp-apps-host": 0.16.14
